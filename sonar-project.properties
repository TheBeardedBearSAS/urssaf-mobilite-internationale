# SonarQube Cloud analysis, run by the CI job "sonarcloud" (automatic analysis must stay disabled on SonarQube Cloud).
sonar.organization=thebeardedbearsas
sonar.projectKey=TheBeardedBearSAS_urssaf-mobilite-internationale
sonar.projectName=urssaf-mobilite-internationale
# Coverage is measured on the package code only (src, 100 % enforced by bin/check-coverage): the tests, the benchmarks
# and the tool configurations at the root are analysed for issues but are not code to cover. SonarQube Cloud ignores
# sonar.sources/sonar.tests with its new analysis scope, hence the explicit exclusion.
sonar.coverage.exclusions=tests/**,*.php
sonar.php.coverage.reportPaths=var/coverage/clover.xml
sonar.php.tests.reportPath=var/coverage/junit.xml
sonar.sourceEncoding=UTF-8

# Justified exceptions (same policy as phpstan.neon.dist and mago.toml: each one explained, nothing else ignored).
sonar.issue.ignore.multicriteria=lowestHighest,symfony8Resolution,exceptionUnderTestCall,exceptionUnderTestNew,umaskUnderTest
# The CI matrix tests the lowest and the highest allowed dependencies on purpose (composer update --prefer-lowest /
# composer update); the locked install (composer install) is used everywhere else.
sonar.issue.ignore.multicriteria.lowestHighest.ruleKey=githubactions:S8546
sonar.issue.ignore.multicriteria.lowestHighest.resourceKey=.github/actions/setup/action.yml
# The "tests (Symfony 8)" job resolves the newest Symfony on purpose (composer update) to prove the Symfony 8 support;
# the locked install proves everything else.
sonar.issue.ignore.multicriteria.symfony8Resolution.ruleKey=githubactions:S8546
sonar.issue.ignore.multicriteria.symfony8Resolution.resourceKey=.github/workflows/ci.yml
# Tests that expect an exception: the call or the instantiation is the action under test, its result never exists.
sonar.issue.ignore.multicriteria.exceptionUnderTestCall.ruleKey=php:S2201
sonar.issue.ignore.multicriteria.exceptionUnderTestCall.resourceKey=tests/**/*
sonar.issue.ignore.multicriteria.exceptionUnderTestNew.ruleKey=php:S1848
sonar.issue.ignore.multicriteria.exceptionUnderTestNew.resourceKey=tests/**/*
# The test sets umask(0) on purpose, to prove the certificate file is created with mode 0600 whatever the umask of the
# process is (the file holds a personal certificate). Only the test touches the umask, and it restores it.
sonar.issue.ignore.multicriteria.umaskUnderTest.ruleKey=php:S2612
sonar.issue.ignore.multicriteria.umaskUnderTest.resourceKey=tests/Functional/Symfony/Command/CertificateCommandTest.php
